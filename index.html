<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rincón del Libro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="encabezado">
        <!--Acá se muestran las tres imagenes en carrusel por medio de las clases de boostrap se programa el cambio automatico-->
        <div id="sliderEncabezado" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="5500">
            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="img/encabezado1.jpg" alt="Encabezado de la librería" class="imagen_encabezado">
                </div>

                <div class="carousel-item">
                    <img src="img/encabezado2.jpg" alt="Libros en una estantería" class="imagen_encabezado">
                </div>

                <div class="carousel-item">
                    <img src="img/encabezado3.jpg" alt="Rincón de lectura" class="imagen_encabezado">
                </div>

        </div>
    </div>
        <nav class="container-fluid d-flex justify-content-between align-items-center">
            <div class="navbar-brand mb-0 h1">
                <span class="navbar-brand mb-0 h1">RINCÓN DEL LIBRO</span>
            </div>

            <div class="d-flex align-items-center gap-3">
                <a href="#" class="carrito"><i class="bi bi-cart-plus-fill"></i><span class="etiqueta-precio">$0.00</span></a>
            </div>
        </nav>
    </div>

     <!--Segundo Navbar donde van las funciones de busqueda.-->
    <nav class="navbar navbar-expand-lg barra-busqueda">
    <div class="container-fluid">

        <span class="texto-categoria">Productos de la categoría: Todas</span>

        <div class="controles-busqueda">

            <div class="dropdown">
                <button class="btn boton-categoria dropdown-toggle" type="button" id="indexCategorias" data-bs-toggle="dropdown"aria-expanded="false">
                    Categorías
                </button>

                <ul class="dropdown-menu dropdown-menu-end"
                    aria-labelledby="menuCategorias">
                    <li><button class="dropdown-item" type="button">Acción</button></li>
                    <li><button class="dropdown-item" type="button">Fantasía</button></li>
                    <li><button class="dropdown-item" type="button">Terror</button></li>
                    <li><button class="dropdown-item" type="button">Historia</button></li>
                    <li><button class="dropdown-item" type="button">Novelas</button></li>
                    <li><button class="dropdown-item" type="button">Académico</button></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><button class="dropdown-item" type="button">Todas las categorías</button></li>
                </ul>
            </div>

            <input class="form-control campo-busqueda" type="search" placeholder="Buscar libro">

            </div>
        </div>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
